<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">

<style>
:root{
  --bg:#0B1013; --surface:#131B20; --surface2:#182228; --line:#24333A;
  --txt:#E6EDF0; --txt2:#8FA3AD; --txt3:#5C7078;
  --in:#3DDC97; --out:#FF6B6B; --cred:#B487FF; --deb:#4CC9F0; --warn:#FFC857;
  --accent:#00C2A8;
  --r:14px; --mono:'JetBrains Mono',ui-monospace,monospace;
}
html[data-theme="light"]{
  --bg:#ECEEF1; --surface:#FFFFFF; --surface2:#F4F6F8; --line:#DCE2E7;
  --txt:#111B21; --txt2:#5A6B75; --txt3:#8798A2;
  --in:#0E9E63; --out:#D63A3A; --cred:#6E3BD1; --deb:#0F7FA8; --warn:#B37800;
  --accent:#00806F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;padding-bottom:90px}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;letter-spacing:-.02em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--txt)}
button{cursor:pointer}
a{color:var(--accent)}
::selection{background:var(--accent);color:#001}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* topo */
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:1220px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;font-size:16px}
.dot{width:10px;height:10px;border-radius:3px;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.spacer{flex:1}
.btn{background:var(--surface2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04120F}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 16px 10px;max-width:1220px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:var(--txt3);padding:8px 12px;border-radius:9px;font-weight:600;white-space:nowrap}
nav button.on{background:var(--surface2);color:var(--txt)}
main{max-width:1220px;margin:0 auto;padding:18px 16px 40px}
section{display:none}section.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--txt3);font-weight:600}
.big{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
@media(max-width:520px){.big{font-size:21px}}
.sub{font-size:12px;color:var(--txt2);margin-top:4px}
.in{color:var(--in)}.out{color:var(--out)}.cred{color:var(--cred)}.deb{color:var(--deb)}.warn{color:var(--warn)}
.rowsp{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--txt2)}
.chip.on{border-color:var(--accent);color:var(--txt)}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid}
.tag.c{color:var(--cred);border-color:color-mix(in srgb,var(--cred) 45%,transparent)}
.tag.d{color:var(--deb);border-color:color-mix(in srgb,var(--deb) 45%,transparent)}
.tag.e{color:var(--in);border-color:color-mix(in srgb,var(--in) 45%,transparent)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);vertical-align:middle}
tbody tr:hover{background:var(--surface2)}
.rt{text-align:right}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
input,select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
label.f{display:block}
label.f span{display:block;margin-bottom:5px}
.bar{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:99px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--txt2)}
.drop.hot{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.empty{text-align:center;padding:44px 16px;color:var(--txt2)}
.empty .disp{font-size:19px;color:var(--txt);margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:11px 16px;z-index:99;font-weight:600;box-shadow:0 10px 30px #0006;max-width:92vw}
.tabbar{position:fixed;bottom:0;left:0;right:0;display:none;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:40}
.tabbar button{flex:1;background:none;border:0;color:var(--txt3);font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:20px;height:20px}
@media(max-width:760px){.tabbar{display:flex}nav{display:none}body{padding-bottom:78px}}
.sticky1 th:first-child,.sticky1 td:first-child{position:sticky;left:0;background:var(--surface);z-index:2}
.sticky1 tbody tr:hover td:first-child{background:var(--surface2)}
.exp{cursor:pointer;user-select:none}
.exp .caret{display:inline-block;width:12px;color:var(--txt3);transition:.15s}
.exp.open .caret{transform:rotate(90deg)}
.lvl2 td:first-child{padding-left:28px;color:var(--txt2)}
.lvl3 td:first-child{padding-left:46px;color:var(--txt3);font-size:12.5px}
.hr{height:1px;background:var(--line);margin:16px 0}
.mini{font-size:12px;color:var(--txt2)}
.pill{display:inline-block;padding:3px 8px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);font-size:11.5px;font-weight:600}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="brand"><span class="dot"></span><span class="disp">Controle financeiro</span></div>
    <div class="spacer"></div>
    <button class="btn sm" id="btnSync">Atualizar</button>
    <button class="btn sm ghost" onclick="go('ajustes')" title="Ajustes">Ajustes</button>
    <button class="btn sm ghost" id="btnTheme" title="Alternar tema">Tema</button>
  </div>
  <nav id="nav"></nav>
</header>

<main>
  <section id="p-painel" class="on"></section>
  <section id="p-lanc"></section>
  <section id="p-pend"></section>
  <section id="p-orc"></section>
  <section id="p-ano"></section>
  <section id="p-caixa"></section>

</main>

<div class="tabbar" id="tabbar"></div>

<div id="lock" style="position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px">
  <div class="card" style="max-width:380px;width:100%">
    <div class="dot" style="margin-bottom:14px"></div>
    <div class="disp" style="font-size:20px">Controle financeiro</div>
    <p class="mini" style="margin:10px 0 16px">Entre com seu e-mail. Um código de seis dígitos chega em segundos e vale por uma hora.</p>
    <label class="f" style="margin-bottom:10px"><span class="lbl">E-mail</span><input id="loginEmail" type="email" placeholder="voce@exemplo.com" autocomplete="email"></label>
    <div id="passoCodigo" style="display:none">
      <label class="f" style="margin-bottom:10px"><span class="lbl">Código recebido</span><input id="loginCodigo" inputmode="numeric" placeholder="000000" autocomplete="one-time-code"></label>
    </div>
    <button class="btn primary" style="width:100%;justify-content:center" id="btnLogin" onclick="acaoLogin()">Enviar código</button>
    <p class="mini" id="loginAviso" style="margin-top:12px;min-height:18px"></p>
  </div>

<script>
/* ============================ armazenamento ============================ */
const mem = {};
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v===null?(k in mem?mem[k]:null):v; }catch(e){ return k in mem?mem[k]:null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
};
const DEF = {
  txs: [], rules: [], budgets: {}, boxes: [],
  cfg: { theme:'dark', cdi:13.90, fechamento:3, vencimento:10, alertaPct:80 }
};
let S = load();
function load(){
  try{ const raw = store.get('fin.v1'); if(!raw) return structuredClone(DEF);
    const o = JSON.parse(raw); return Object.assign(structuredClone(DEF), o, {cfg:Object.assign({},DEF.cfg,o.cfg||{})});
  }catch(e){ return structuredClone(DEF); }
}
function save(){ store.set('fin.v1', JSON.stringify(S)); }

/* ============================ utilitários ============================ */
const BRL = n => (n<0?'-':'') + new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Math.abs(n||0));
const NUM = n => new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const norm = s => (s||'').toString().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
const esc = s => (s||'').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ym = d => d.slice(0,7);
function hash(str){ let h=5381; for(let i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))|0; return 'x'+(h>>>0).toString(36); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
const hoje = () => new Date().toISOString().slice(0,10);

const CATS = ['Moradia','Mercado','Alimentação','Transporte','Saúde','Educação','Academia','Lazer','Assinaturas','Compras','Pets','Tarifas e impostos','Transferências','Investimentos','Renda','Outros'];

const SEED = [
  ['IFOOD','Alimentação'],['RAPPI','Alimentação'],['RESTAURANTE','Alimentação'],['LANCHONETE','Alimentação'],['PADARIA','Alimentação'],['BURGER','Alimentação'],['PIZZA','Alimentação'],['CAFE','Alimentação'],
  ['SUPERMERC','Mercado'],['ATACAD','Mercado'],['ASSAI','Mercado'],['CARREFOUR','Mercado'],['PAO DE ACUCAR','Mercado'],['HORTIFRUTI','Mercado'],['MERCADO','Mercado'],['SENDAS','Mercado'],
  ['UBER','Transporte'],['99APP','Transporte'],['99 APP','Transporte'],['POSTO','Transporte'],['SHELL','Transporte'],['IPIRANGA','Transporte'],['PETROBRAS','Transporte'],['ESTACIONAMENTO','Transporte'],['PEDAGIO','Transporte'],['SEM PARAR','Transporte'],['VELOE','Transporte'],
  ['DROGARIA','Saúde'],['DROGA RAIA','Saúde'],['PACHECO','Saúde'],['PAGUE MENOS','Saúde'],['FARMACIA','Saúde'],['CLINICA','Saúde'],['LABORATORIO','Saúde'],['UNIMED','Saúde'],['ODONTO','Saúde'],
  ['SMART FIT','Academia'],['ACADEMIA','Academia'],['CROSSFIT','Academia'],['JIU','Academia'],['BOX ','Academia'],
  ['NETFLIX','Assinaturas'],['SPOTIFY','Assinaturas'],['AMAZON PRIME','Assinaturas'],['DISNEY','Assinaturas'],['MAX ','Assinaturas'],['GOOGLE','Assinaturas'],['APPLE.COM','Assinaturas'],['OPENAI','Assinaturas'],['ANTHROPIC','Assinaturas'],['MICROSOFT','Assinaturas'],
  ['MERCADOLIVRE','Compras'],['MERCADO LIVRE','Compras'],['SHOPEE','Compras'],['AMAZON','Compras'],['ALIEXPRESS','Compras'],['MAGAZINE','Compras'],['RENNER','Compras'],['CENTAURO','Compras'],
  ['ENERGISA','Moradia'],['LIGHT','Moradia'],['ENEL','Moradia'],['CEDAE','Moradia'],['AGUAS','Moradia'],['CONDOMINIO','Moradia'],['ALUGUEL','Moradia'],['IPTU','Moradia'],['VIVO','Moradia'],['CLARO','Moradia'],['TIM','Moradia'],['OI ','Moradia'],['GIGA','Moradia'],['INTERNET','Moradia'],
  ['CINEMA','Lazer'],['INGRESSO','Lazer'],['BAR ','Lazer'],['HOTEL','Lazer'],['AIRBNB','Lazer'],['LATAM','Lazer'],['GOL ','Lazer'],['AZUL','Lazer'],
  ['PETSHOP','Pets'],['PET SHOP','Pets'],['VETERIN','Pets'],
  ['CURSO','Educação'],['FACULDADE','Educação'],['GRAN CURSOS','Educação'],['LIVRARIA','Educação'],
  ['IOF','Tarifas e impostos'],['ANUIDADE','Tarifas e impostos'],['TARIFA','Tarifas e impostos'],['JUROS','Tarifas e impostos'],['MULTA','Tarifas e impostos'],['DARF','Tarifas e impostos'],
  ['RDB','Investimentos'],['CAIXINHA','Investimentos'],['RESGATE','Investimentos'],['APLICACAO','Investimentos'],['TESOURO','Investimentos'],
  ['SALARIO','Renda'],['PAGAMENTO DE SALARIO','Renda'],['ALLOHA','Renda'],['PROVENTO','Renda'],['RENDIMENTO','Renda'],
  ['PAGAMENTO DE FATURA','Pagamento de fatura'],['PAGAMENTO RECEBIDO','Pagamento de fatura'],['TRANSFERENCIA ENVIADA','Transferências'],['TRANSFERENCIA RECEBIDA','Transferências'],['PANIFIC','Alimentação'],['ACOUGUE','Mercado'],['APLICACAO RDB','Investimentos'],['RESGATE RDB','Investimentos'],['SALDO EM ATRASO','Tarifas e impostos']
];

/* ============================ parsers ============================ */
function splitCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','||c===';'){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(c!=='\r') cur+=c;
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(v=>v.trim()!==''));
}
function dt(v){
  v=(v||'').trim();
  let m=v.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if(m) return m[3]+'-'+m[2]+'-'+m[1];
  m=v.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
  m=v.match(/^(\d{4})(\d{2})(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  return null;
}
function money(v){
  if(typeof v==='number') return v;
  v=(v||'').toString().replace(/[R$\s]/g,'');
  if(v.includes(',')) v=v.replace(/\./g,'').replace(',','.');
  const n=parseFloat(v); return isNaN(n)?0:n;
}
function parseOFX(text, fonte){
  const out=[]; const blocks=text.split(/<STMTTRN>/i).slice(1);
  for(const b of blocks){
    const g=r=>{const m=b.match(r);return m?m[1].trim():'';};
    const d=dt(g(/<DTPOSTED>([^<\r\n]+)/i));
    const v=money(g(/<TRNAMT>([^<\r\n]+)/i));
    const desc=g(/<MEMO>([^<\r\n]+)/i)||g(/<NAME>([^<\r\n]+)/i);
    if(d) out.push(mk(d,desc,v,fonte));
  }
  return out;
}
function mk(data,desc,valor,fonte){
  return { data, desc:(desc||'sem descrição').trim(), valor:+valor.toFixed(2), fonte, cat:null };
}
/* fonte: 'debito' (conta) ou 'credito' (cartão) */
function parseArquivo(nome, text){
  const f = /cart|credit|fatura/i.test(nome) ? 'credito' : /cont|extrat|debit/i.test(nome) ? 'debito' : null;
  if(/<OFX|<STMTTRN>/i.test(text)) return parseOFX(text, f||'debito');
  const rows = splitCSV(text); if(rows.length<2) return [];
  const head = rows[0].map(h=>norm(h));
  const iData = head.findIndex(h=>/^DATA$|^DATE$/.test(h));
  const iVal  = head.findIndex(h=>/^VALOR$|^AMOUNT$/.test(h));
  const iDesc = head.findIndex(h=>/DESCRI|TITLE|HISTORIC|ESTABELEC/.test(h));
  if(iData<0||iVal<0) return [];
  const cartao = f==='credito' || (head.includes('TITLE') && head.includes('AMOUNT'));
  const out=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; const d=dt(r[iData]); if(!d) continue;
    let v=money(r[iVal]);
    if(cartao) v = -v;                     /* fatura: compra vira saída, estorno vira entrada */
    out.push(mk(d, iDesc>=0?r[iDesc]:'', v, cartao?'credito':'debito'));
  }
  return out;
}

/* ============================ categorização ============================ */
function regras(){ return S.rules.length ? S.rules : (S.rules = SEED.map(([kw,cat])=>({kw,cat})), save(), S.rules); }
function categoriza(tx){
  const d = norm(tx.desc);
  for(const r of regras()){ if(d.includes(norm(r.kw))) return r.cat; }
  if(tx.fonte==='debito' && tx.valor>0 && /PIX|TED|TRANSF/.test(d)) return 'Transferências';
  return null;
}
function sugereChave(desc){
  let d = norm(desc).replace(/ - PARCELA \d+\/\d+$/,'');
  /* descricoes do Nubank vem como "Compra no debito - LOJA" ou "Transferencia enviada pelo Pix - FULANO".
     O que identifica de verdade e o que vem depois do primeiro tracinho. */
  const corte = d.indexOf(' - ');
  if(corte > 0 && corte < 45) d = d.slice(corte + 3);
  d = d.replace(/^(COMPRA|PAGAMENTO|PIX|TRANSFERENCIA|DEBITO|CREDITO)[ -]*/,'');
  return d.split(/[ \-*\/]/).filter(w=>w.length>2).slice(0,2).join(' ') || d.slice(0,14);
}
function reaplicar(){ S.txs.forEach(t=>{ if(!t.fixo) t.cat = categoriza(t) || t.cat; }); }

function addTxs(list){
  const idx = new Set(S.txs.map(t=>t.id));
  let novos=0;
  for(const t of list){
    t.id = hash(t.fonte+t.data+norm(t.desc)+t.valor);
    if(idx.has(t.id)) continue;
    t.cat = categoriza(t);
    idx.add(t.id); S.txs.push(t); novos++;
  }
  S.txs.sort((a,b)=> b.data.localeCompare(a.data));
  save();
  if(novos) nuvem(gravarLancamentos(S.txs.filter(t=>!t.enviado).map(t=>(t.enviado=true,t))));
  return novos;
}

/* ============================ seletores de dados ============================ */
const anos = () => [...new Set(S.txs.map(t=>t.data.slice(0,4)))].sort().reverse();
let filtro = { ym: hoje().slice(0,7), ano: hoje().slice(0,4), fonte:'todas', modo:'realizado' };
const doMes = m => S.txs.filter(t=>ym(t.data)===m);
/* mover dinheiro entre contas suas nao e gasto nem receita: pagar a fatura, aplicar e resgatar */
const NAO_GASTO = new Set(['Pagamento de fatura','Investimentos','Transferências']);
const real = t => !NAO_GASTO.has(t.cat);
const gasto = ts => ts.filter(t=>t.valor<0 && real(t)).reduce((s,t)=>s+Math.abs(t.valor),0);
const entrada = ts => ts.filter(t=>t.valor>0 && real(t)).reduce((s,t)=>s+t.valor,0);
const movido = ts => ts.filter(t=>t.valor<0 && !real(t)).reduce((s,t)=>s+Math.abs(t.valor),0);
function porCat(ts){ const o={}; ts.filter(t=>t.valor<0 && real(t)).forEach(t=>{ const c=t.cat||'Sem categoria'; o[c]=(o[c]||0)+Math.abs(t.valor); }); return Object.entries(o).sort((a,b)=>b[1]-a[1]); }
function previsto(cat, mes){ const b=S.budgets[cat]; if(!b) return 0; return (b.meses&&b.meses[mes]!=null)?b.meses[mes]:(b.padrao||0); }
function realizado(cat, mes){ return doMes(mes).filter(t=>t.valor<0 && (t.cat||'Sem categoria')===cat).reduce((s,t)=>s+Math.abs(t.valor),0); }

/* ============================ gráficos (SVG) ============================ */
function barras(dados){ /* [{l, v, v2}] */
  const max = Math.max(1, ...dados.map(d=>Math.max(d.v,d.v2||0)));
  const w = 100/dados.length;
  let s = '<svg viewBox="0 0 100 42" preserveAspectRatio="none" style="width:100%;height:130px">';
  dados.forEach((d,i)=>{
    const h = (d.v/max)*34, x=i*w;
    s += '<rect x="'+(x+w*0.22)+'" y="'+(36-h)+'" width="'+(w*0.56)+'" height="'+Math.max(h,0.4)+'" rx="0.7" fill="var(--out)" opacity=".85"/>';
    if(d.v2!=null){ const h2=(d.v2/max)*34; s+='<rect x="'+(x+w*0.22)+'" y="'+(36-h2)+'" width="'+(w*0.56)+'" height="0.6" fill="var(--warn)"/>'; }
    s += '<text x="'+(x+w/2)+'" y="41" font-size="3" text-anchor="middle" fill="var(--txt3)" font-family="JetBrains Mono">'+d.l+'</text>';
  });
  return s+'</svg>';
}
function rosca(pares){
  const tot = pares.reduce((s,p)=>s+p[1],0)||1;
  const cores=['#00C2A8','#B487FF','#4CC9F0','#FFC857','#FF6B6B','#3DDC97','#8FA3AD','#FF9F6B'];
  let a=-Math.PI/2, s='<svg viewBox="0 0 42 42" style="width:132px;height:132px">';
  pares.slice(0,8).forEach((p,i)=>{
    const ang=(p[1]/tot)*Math.PI*2, b=a+ang, r=18, cx=21, cy=21;
    const x1=cx+r*Math.cos(a), y1=cy+r*Math.sin(a), x2=cx+r*Math.cos(b), y2=cy+r*Math.sin(b);
    s+='<path d="M '+cx+' '+cy+' L '+x1+' '+y1+' A '+r+' '+r+' 0 '+(ang>Math.PI?1:0)+' 1 '+x2+' '+y2+' Z" fill="'+cores[i%8]+'" opacity=".9"/>';
    a=b;
  });
  s+='<circle cx="21" cy="21" r="11" fill="var(--surface)"/></svg>';
  return s;
}

function calcFloat(){
  const out=document.getElementById('floatOut'); if(!out) return;
  const v=+document.getElementById('fVal').value||0;
  const d=new Date(document.getElementById('fData').value+'T12:00:00');
  const dia=d.getDate(), fech=+S.cfg.fechamento, venc=+S.cfg.vencimento;
  let venci=new Date(d);
  if(dia<=fech){ venci.setDate(venc); if(venc<dia) venci.setMonth(venci.getMonth()+1); }
  else { venci.setMonth(venci.getMonth()+1); venci.setDate(venc); if(venc<fech) venci.setMonth(venci.getMonth()+1); }
  const dias=Math.max(0,Math.round((venci-d)/86400000));
  const taxaDia=Math.pow(1+S.cfg.cdi/100,1/365)-1;
  const bruto=v*(Math.pow(1+taxaDia,dias)-1);
  const liq=bruto*0.775;
  out.innerHTML=`<div class="rowsp"><span class="mini">Vence em</span><span class="pill num">${venci.toLocaleDateString('pt-BR')}</span></div>
  <div class="rowsp" style="margin-top:6px"><span class="mini">Dinheiro parado a seu favor</span><span class="pill num">${dias} dias</span></div>
  <div class="rowsp" style="margin-top:6px"><span class="mini">Ganho líquido do crédito</span><span class="pill num in">${BRL(liq)}</span></div>
  <p class="mini" style="margin-top:10px">${liq<2
    ? 'Diferença irrelevante. Escolha pelo controle: débito sai do saldo na hora e é mais difícil de perder de vista.'
    : 'Vale usar crédito e deixar o valor rendendo, desde que você separe o dinheiro agora e pague a fatura à vista. Se houver chance de rolar a fatura, use débito: o juro rotativo do cartão come esse ganho em menos de um dia.'}</p>`;
}

function aplicaRegra(kw,selId){
  const cat=document.getElementById(selId).value;
  if(!cat){ toast('Escolha uma categoria antes de salvar.'); return; }
  S.rules.unshift({kw,cat});
  S.txs.forEach(t=>{ if(!t.cat && norm(t.desc).includes(norm(kw))) t.cat=cat; });
  save(); toast('Regra criada para '+kw); render();
  nuvem(Promise.all([
    sb('regras', {method:'POST', headers:{Prefer:'resolution=merge-duplicates'}, body:JSON.stringify({chave:kw, categoria:cat})}),
    gravarLancamentos(S.txs.filter(t=>t.cat===cat))
  ]));
}

function setOrc(cat,mes,v){
  S.budgets[cat]=S.budgets[cat]||{padrao:0,meses:{}};

  nuvem(sb('orcamentos', {method:'POST', headers:{Prefer:'resolution=merge-duplicates'},
    body:JSON.stringify({categoria:cat, mes:mes, valor:+v||0})}));
}
function copiarOrc(){
  const m=filtro.ym;

  save(); toast('Valores do mês viraram o padrão do ano'); render();
  nuvem(sb('orcamentos', {method:'POST', headers:{Prefer:'resolution=merge-duplicates'},
    body:JSON.stringify(Object.keys(S.budgets).map(c=>({categoria:c, mes:'padrao', valor:S.budgets[c].padrao||0})))}));
}

let abertos={};
function vAno(){
  const el=document.getElementById('p-ano');
  const ano=filtro.ano;
  const meses=Array.from({length:12},(_,i)=>ano+'-'+String(i+1).padStart(2,'0'));
  const cats=[...new Set(S.txs.filter(t=>t.valor<0&&t.data.startsWith(ano)).map(t=>t.cat||'Sem categoria').concat(Object.keys(S.budgets)))].sort();
  const modo=filtro.modo;
  const val=(c,mm)=> modo==='previsto'?previsto(c,mm): modo==='realizado'?realizado(c,mm): previsto(c,mm)-realizado(c,mm);
  const linhas=[];
  const grupos={ 'Crédito':t=>t.fonte==='credito', 'Débito':t=>t.fonte==='debito' };
  cats.forEach(c=>{
    const vals=meses.map(mm=>val(c,mm));
    const tot=vals.reduce((a,b)=>a+b,0);
    if(tot===0 && modo!=='previsto') return;
    linhas.push({c,vals,tot});
  });
  const totMes=meses.map((mm,i)=>linhas.reduce((s,l)=>s+l.vals[i],0));
  el.innerHTML=`
  <div class="rowsp" style="margin-bottom:12px;flex-wrap:wrap;gap:10px">
    <select style="width:auto" onchange="filtro.ano=this.value;render()">${anos().map(a=>`<option ${a===ano?'selected':''}>${a}</option>`).join('')}</select>
    <div class="chips">${[['realizado','Realizado'],['previsto','Previsto'],['desvio','Previsto menos realizado']].map(([k,t])=>`<button class="chip ${modo===k?'on':''}" onclick="filtro.modo='${k}';render()">${t}</button>`).join('')}</div>
  </div>
  <div class="card" style="padding:0"><div class="scroll"><table class="sticky1">
    <thead><tr><th style="min-width:180px">Categoria</th>${MES.map(m=>`<th class="rt">${m}</th>`).join('')}<th class="rt">Ano</th></tr></thead>
    <tbody>
      ${linhas.map(l=>{
        const key=hash(l.c), aberto=abertos[key];
        const sub = aberto ? subLinhas(l.c, meses, modo) : '';
        return `<tr class="exp ${aberto?'open':''}" onclick="abertos['${key}']=!abertos['${key}'];vAno()">
          <td><span class="caret">›</span> ${esc(l.c)}</td>
          ${l.vals.map(v=>`<td class="rt num" style="color:${cor(v,modo)}">${v?NUM(v):'·'}</td>`).join('')}
          <td class="rt num" style="font-weight:700">${NUM(l.tot)}</td></tr>${sub}`;
      }).join('')}
    </tbody>
    <tfoot><tr><th>Total</th>${totMes.map(v=>`<th class="rt num">${NUM(v)}</th>`).join('')}<th class="rt num">${NUM(totMes.reduce((a,b)=>a+b,0))}</th></tr></tfoot>
  </table></div></div>
  <p class="mini" style="margin-top:10px">Toque em uma categoria para abrir a cascata por estabelecimento. Valores em reais, sem centavos arredondados.</p>`;
}
function cor(v,modo){ if(!v) return 'var(--txt3)'; if(modo==='desvio') return v<0?'var(--out)':'var(--in)'; return 'var(--txt)'; }
function subLinhas(cat, meses, modo){
  if(modo==='previsto') return `<tr class="lvl2"><td colspan="14" class="mini">O previsto é definido por categoria, sem quebra por estabelecimento.</td></tr>`;
  const ts=S.txs.filter(t=>t.valor<0 && (t.cat||'Sem categoria')===cat && meses.includes(ym(t.data)));
  const por={};
  ts.forEach(t=>{ const k=sugereChave(t.desc); por[k]=por[k]||{}; const i=+t.data.slice(5,7)-1; por[k][i]=(por[k][i]||0)+Math.abs(t.valor); });
  return Object.entries(por).sort((a,b)=>somaObj(b[1])-somaObj(a[1])).slice(0,12).map(([k,o])=>
    `<tr class="lvl2"><td>${esc(k)}</td>${meses.map((_,i)=>`<td class="rt num" style="color:var(--txt2)">${o[i]?NUM(o[i]):'·'}</td>`).join('')}<td class="rt num">${NUM(somaObj(o))}</td></tr>`).join('');
}
const somaObj=o=>Object.values(o).reduce((a,b)=>a+b,0);

/* ---------- caixinhas ---------- */
function vCaixa(){
  const el=document.getElementById('p-caixa');
  const cdi=S.cfg.cdi/100;
  const ir=d=> d<=180?0.225: d<=360?0.20: d<=720?0.175:0.15;
  const proj=(v,pct,d)=>{ const taxa=Math.pow(1+cdi*pct/100,d/365)-1; const bruto=v*taxa; return {bruto, liq:bruto*(1-ir(d))}; };
  const tot=S.boxes.reduce((s,b)=>s+(+b.valor||0),0);
  el.innerHTML=`
  <div class="grid g3" style="margin-bottom:12px">
    <div class="card"><div class="lbl">Guardado hoje</div><div class="big">${BRL(tot)}</div><div class="sub">${S.boxes.length} caixinhas</div></div>
    <div class="card"><div class="lbl">CDI usado no cálculo</div><div class="big num">${NUM(S.cfg.cdi)}%</div><div class="sub">ao ano, editável em Ajustes</div></div>
    <div class="card"><div class="lbl">Rende por dia útil</div><div class="big in">${BRL(tot*(Math.pow(1+cdi,1/252)-1))}</div><div class="sub">bruto, a 100% do CDI</div></div>
  </div>
  <div class="card" style="padding:0;margin-bottom:12px"><div class="scroll"><table>
    <thead><tr><th>Caixinha</th><th class="rt">Saldo</th><th class="rt">% do CDI</th><th class="rt">30 dias</th><th class="rt">6 meses</th><th class="rt">12 meses</th><th></th></tr></thead>
    <tbody>${S.boxes.map((b,i)=>{
      const v=+b.valor||0,p=+b.pct||100;
      const a=proj(v,p,30),c=proj(v,p,180),d=proj(v,p,365);
      return `<tr>
        <td><input value="${esc(b.nome)}" onchange="setCaixa(${i},'nome',this.value)"></td>
        <td class="rt"><input class="num rt" type="number" value="${v}" style="width:120px;text-align:right" onchange="setCaixa(${i},'valor',+this.value)"></td>
        <td class="rt"><input class="num rt" type="number" value="${p}" style="width:80px;text-align:right" onchange="setCaixa(${i},'pct',+this.value)"></td>
        <td class="rt num in">${BRL(a.liq)}</td><td class="rt num in">${BRL(c.liq)}</td><td class="rt num in">${BRL(d.liq)}</td>
        <td class="rt"><button class="btn sm ghost" onclick="removeCaixa(${i})">remover</button></td></tr>`;
    }).join('')||'<tr><td colspan="7" class="mini">Nenhuma caixinha cadastrada.</td></tr>'}</tbody>
  </table></div></div>
  <button class="btn primary" onclick="novaCaixa()">Adicionar caixinha</button>
  <div class="card" style="margin-top:12px">
    <div class="lbl">Como o número é calculado</div>
    <p class="mini" style="margin-top:8px">Os valores das colunas já saem líquidos de imposto de renda, pela tabela regressiva: 22,5% até 180 dias, 20% de 181 a 360, 17,5% de 361 a 720 e 15% acima disso. Resgates antes de 30 dias também pagam IOF, que não entra na conta acima. O rendimento real do Nubank varia com o CDI do dia, então trate isso como projeção, não como extrato.</p>
  </div>`;
}

function salvaCaixa(b){
  return sb('caixinhas' + (b.id ? '?id=eq.'+b.id : ''), { method: b.id ? 'PATCH' : 'POST',
    headers:{ Prefer:'return=representation' },
    body: JSON.stringify({ nome:b.nome, valor:b.valor, pct_cdi:b.pct }) });
}
function setCaixa(i, campo, valor){ S.boxes[i][campo]=valor; save(); if(campo!=='nome') render(); nuvem(salvaCaixa(S.boxes[i])); }
function novaCaixa(){
  const b={nome:'Nova caixinha', valor:0, pct:100};
  S.boxes.push(b); save(); render();
  salvaCaixa(b).then(r=>{ if(r&&r[0]){ b.id=r[0].id; save(); } }).catch(e=>toast('Não salvou na nuvem: '+e.message));
}
function removeCaixa(i){
  const b=S.boxes.splice(i,1)[0]; save(); render();
  if(b.id) nuvem(sb('caixinhas?id=eq.'+b.id, {method:'DELETE'}));
}

      <thead><tr><th>Quando a descrição tiver</th><th>Categoria</th><th></th></tr></thead>
      <tbody>${S.rules.slice(0,300).map((r,i)=>`<tr><td class="num">${esc(r.kw)}</td><td>${esc(r.cat)}</td><td class="rt"><button class="btn sm ghost" onclick="S.rules.splice(${i},1);save();render()">remover</button></td></tr>`).join('')}</tbody>

    <div class="chips">
      <button class="btn sm" onclick="backup()">Baixar cópia</button>
      <label class="btn sm">Restaurar cópia<input type="file" accept=".json" style="display:none" onchange="restaura(this.files[0])"></label>
      <button class="btn sm ghost" onclick="if(confirm('Apaga todos os lançamentos, regras e orçamentos. Continuar?')){S=structuredClone(DEF);save();render();}">Apagar tudo</button>
    </div>
    <p class="mini" style="margin-top:12px">${temStorage()?'Salvamento no aparelho: ativo.':'Salvamento no aparelho indisponível neste modo de visualização. Abra o arquivo direto no navegador para os dados persistirem.'}</p>

function temStorage(){ try{ localStorage.setItem('t','1'); localStorage.removeItem('t'); return true; }catch(e){ return false; } }
function salvaCfg(){
  const v=id=>{ const e=document.getElementById(id); return e?e.value.trim():''; };
  S.cfg.fechamento=+document.getElementById('cfgFec').value||1;
  S.cfg.vencimento=+document.getElementById('cfgVen').value||10;
  S.cfg.cdi=+document.getElementById('cfgCdi').value||0;
  save(); nuvem(gravarConfig(), 'Ajustes salvos');
}
function ligaDrop(){
  const d=document.getElementById('drop'), f=document.getElementById('file');
  if(!d) return;
  f.onchange=()=>lerArquivos(f.files);
  ['dragenter','dragover'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.add('hot');}));
  ['dragleave','drop'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.remove('hot');}));
  d.addEventListener('drop',ev=>lerArquivos(ev.dataTransfer.files));
}
function lerArquivos(files){
  let total=0, faltam=files.length;
  [...files].forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{ total+=importaTexto(f.name, r.result, true); if(--faltam===0){ save(); render(); toast(total?total+' lançamentos novos':'Nada novo nesses arquivos'); } };
    r.onerror=()=>{ if(--faltam===0){ render(); toast('Não consegui ler um dos arquivos'); } };
    r.readAsText(f,'utf-8');
  });
}
function importaTexto(nome,texto,silencioso){
  const list=parseArquivo(nome,texto);
  if(!list.length){ if(!silencioso) toast('Formato não reconhecido nesse arquivo'); return 0; }
  const n=addTxs(list);
  if(!silencioso){ render(); toast(n+' lançamentos novos'); }
  return n;
}
function backup(){
  const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='financeiro-'+hoje()+'.json'; a.click();
}
function restaura(file){
  const r=new FileReader();
  r.onload=()=>{ try{ S=Object.assign(structuredClone(DEF),JSON.parse(r.result)); save(); render(); toast('Cópia restaurada'); }catch(e){ toast('Arquivo de cópia inválido'); } };
  r.readAsText(file);
}
function exportCSV(){
  const linhas=[['data','descricao','tipo','categoria','valor']].concat(
    S.txs.map(t=>[t.data,'"'+t.desc.replace(/"/g,'""')+'"',t.fonte,t.cat||'',t.valor]));
  const b=new Blob([linhas.map(l=>l.join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='lancamentos.csv'; a.click();
}

/* ============================ Supabase ============================ */
const SB_URL = 'https://bcrwaciriwfweltgrlng.supabase.co';
const SB_KEY = 'sb_publishable_1RW2RS6OzgZcV5VPQwupqA_5MobcYio';
let sessao = null;

function sbHead(extra){
  return Object.assign({ apikey: SB_KEY, Authorization: 'Bearer ' + (sessao ? sessao.access_token : SB_KEY),
    'Content-Type': 'application/json' }, extra || {});
}
async function sb(caminho, opcoes){
  const o = opcoes || {};
  /* os cabecalhos vem por ultimo de proposito: se vierem primeiro, qualquer opcao com
     headers proprios apaga a chave da API e o Supabase recusa a chamada */
  const r = await fetch(SB_URL + '/rest/v1/' + caminho, Object.assign({}, o, { headers: sbHead(o.headers) }));
  if(!r.ok) throw new Error(await r.text());
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}
async function sbAuth(caminho, corpo){
  const r = await fetch(SB_URL + '/auth/v1/' + caminho, { method:'POST',
    headers:{ apikey: SB_KEY, 'Content-Type':'application/json' }, body: JSON.stringify(corpo) });
  const j = await r.json();
  if(!r.ok) throw new Error(j.error_description || j.msg || j.message || 'falha na autenticação');
  return j;
}
function guardaSessao(s){
  sessao = s;
  try{ localStorage.setItem('fin.sessao', JSON.stringify(s)); }catch(e){ mem['fin.sessao'] = JSON.stringify(s); }
}
function leSessao(){
  try{ const raw = store.get('fin.sessao'); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
async function renovaSessao(){
  const s = leSessao();
  if(!s || !s.refresh_token) return null;
  try{
    const nova = await sbAuth('token?grant_type=refresh_token', { refresh_token: s.refresh_token });
    guardaSessao(nova); return nova;
  }catch(e){ return null; }
}
async function enviarLink(email){
  await sbAuth('otp', { email, create_user: true });
}
async function entrarComCodigo(email, codigo){
  const j = await sbAuth('verify', { email, token: codigo, type: 'email' });
  guardaSessao(j);
  return j;
}
function sairDaConta(){
  sessao = null;
  try{ localStorage.removeItem('fin.sessao'); localStorage.removeItem('fin.v1'); }catch(e){}
  location.reload();
}

function emailAtual(){ try{ return JSON.parse(atob(sessao.access_token.split('.')[1])).email; }catch(e){ return 'conectado'; } }

/* ---------- carga e gravação ---------- */
async function carregarTudo(){
  const [lanc, reg, orc, cx, cfg] = await Promise.all([
    sb('lancamentos?select=*&order=data.desc'),
    sb('regras?select=*'),
    sb('orcamentos?select=*'),
    sb('caixinhas?select=*'),
    sb('config?select=dados')
  ]);
  S.txs = lanc.map(l => ({ id:l.id, data:l.data, desc:l.descricao, valor:+l.valor, fonte:l.fonte, cat:l.categoria, fixo:l.fixo }));
  S.rules = reg.length ? reg.map(r => ({ kw:r.chave, cat:r.categoria })) : SEED.map(([kw,cat]) => ({kw,cat}));
  S.budgets = {};
  orc.forEach(o => {
    S.budgets[o.categoria] = S.budgets[o.categoria] || { padrao:0, meses:{} };
    if(o.mes === 'padrao') S.budgets[o.categoria].padrao = +o.valor;
    else S.budgets[o.categoria].meses[o.mes] = +o.valor;
  });
  S.boxes = cx.map(c => ({ id:c.id, nome:c.nome, valor:+c.valor, pct:+c.pct_cdi }));
  if(cfg[0] && cfg[0].dados) S.cfg = Object.assign({}, DEF.cfg, cfg[0].dados);
  if(!reg.length) await sb('regras', { method:'POST', headers:{Prefer:'resolution=merge-duplicates'},
    body: JSON.stringify(S.rules.map(r => ({ chave:r.kw, categoria:r.cat }))) });
  save();
}
async function gravarLancamentos(lista){
  if(!lista.length) return;
  for(let i = 0; i < lista.length; i += 300){
    await sb('lancamentos', { method:'POST', headers:{ Prefer:'resolution=merge-duplicates' },
      body: JSON.stringify(lista.slice(i, i+300).map(t => ({
        id:t.id, data:t.data, descricao:t.desc, valor:t.valor, fonte:t.fonte, categoria:t.cat, fixo:!!t.fixo }))) });
  }
}
async function gravarConfig(){
  await sb('config', { method:'POST', headers:{ Prefer:'resolution=merge-duplicates' },
    body: JSON.stringify({ dados: S.cfg, atualizado: new Date().toISOString() }) });
}
function nuvem(promessa, ok){
  promessa.then(() => { if(ok) toast(ok); }).catch(e => toast('Não salvou na nuvem: ' + e.message));
}

/* ---------- sincronizar ---------- */
async function sincroniza(){
  const b = document.getElementById('btnSync'); b.textContent = 'Buscando'; b.disabled = true;
  try{
    await carregarTudo();
    render();
    toast(S.txs.length + ' lançamentos na nuvem');
  }catch(e){ toast('Falhou: ' + (e.message || e)); }
  finally{ b.textContent = 'Atualizar'; b.disabled = false; }
}
/* ============================ login e boot ============================ */
function aviso(t, cor){ const e=document.getElementById('loginAviso'); if(e){ e.textContent=t; e.style.color=cor||'var(--txt2)'; } }
let emailPendente='';
async function acaoLogin(){
  const b=document.getElementById('btnLogin');
  const email=(document.getElementById('loginEmail').value||'').trim();
  if(!email.includes('@')){ aviso('Escreva um e-mail válido.','var(--out)'); return; }
  b.disabled=true;
  try{
    if(!emailPendente){
      await enviarLink(email);
      emailPendente=email;
      document.getElementById('passoCodigo').style.display='block';
      b.textContent='Entrar';
      aviso('Código enviado. Confira a caixa de entrada e o lixo eletrônico.');
    } else {
      const codigo=(document.getElementById('loginCodigo').value||'').trim();
      if(codigo.length<6){ aviso('O código tem seis dígitos.','var(--out)'); b.disabled=false; return; }
      await entrarComCodigo(emailPendente, codigo);
      await abrirApp();
    }
  }catch(e){ aviso(e.message||'não deu certo','var(--out)'); }
  finally{ b.disabled=false; }
}
async function abrirApp(){
  document.getElementById('lock').style.display='none';
  try{ await carregarTudo(); }catch(e){ toast('Banco fora do ar: '+e.message); }
  if(S.txs.length){ filtro.ym=ym(S.txs[0].data); filtro.ano=S.txs[0].data.slice(0,4); }
  document.documentElement.dataset.theme=S.cfg.theme||'dark';
  montaNav(); go('painel');
}
document.getElementById('btnSync').onclick=sincroniza;
document.getElementById('btnTheme').onclick=()=>{
  const t=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=t; S.cfg.theme=t; save(); nuvem(gravarConfig());
};
document.documentElement.dataset.theme=S.cfg.theme||'dark';
regras(); montaNav();
(async () => {
  const s = await renovaSessao();
  if(s) abrirApp();
})();
</script>
